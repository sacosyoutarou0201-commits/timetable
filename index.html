<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>時間割</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     
    <style>
        table {
            margin: 0 auto;
            font-size: 30px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 4px;
        }
        input[type="button"] {
            width: 130px;      
            height: 65px;      
            font-size: 16px;   
            cursor: pointer;   
            white-space: pre-wrap; /* ボタン内で改行を有効にする */
            line-height: 1.3;
            border: 1px solid #bbb;
            border-radius: 4px;
            background-color: #ffffff; /* 初期は白 */
            transition: background-color 0.2s;
        }
        /* 欠席文字用のスタイル */
        .absent-text-danger {
            color: #a22041; /* 欠席回数があるときは赤文字 */
            font-weight: bold;
        }
        .absent-text-normal {
            color: #666; /* 欠席0回のときは薄いグレー */
        }
    </style>
</head>
<body>
    <script>
    // ★授業名ごとに自動でやさしい背景色を割り当てるためのカラーリスト
    const colorPalette = [
        '#e1f5fe', '#f3e5f5', '#efebe9', '#e8f5e9', '#fff3e0', 
        '#fce4ec', '#f0f4c3', '#e0f2f1', '#e8eaf6', '#ede7f6',
        '#afeeee', '#f8f8ff'
    ];

    // 授業名文字列からハッシュ値を計算して、常に同じ色を返す関数
    function getSubjectColor(subjectName) {
        if (!subjectName) return '#ffffff'; // 空欄は白
        let hash = 0;
        for (let i = 0; i < subjectName.length; i++) {
            hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
        }
        const index = Math.abs(hash) % colorPalette.length;
        return colorPalette[index];
    }

    function clicked(id) {
        const btn = document.getElementById(id);
        const savedName = localStorage.getItem(id) || '';

        if (!savedName) {
            // 空欄なら新規登録
            const nameInput = prompt('授業名を入力してください：');
            if (nameInput) {
                localStorage.setItem(id, nameInput.trim()); // 授業名を保存
                refreshAllButtons(); // 全体の色と表示を更新
            }
        } else {
            // 共通の出欠ページに、URLパラメータとして授業名をつけて別タブで開く
            const pageUrl = `attendance.html?subject=${encodeURIComponent(savedName)}`; 
            window.open(pageUrl, '_blank');
        }
    }

    // 【右クリック用】授業名の編集・削除
    function editCell(e, id) {
        e.preventDefault(); // ブラウザ標準の右クリックメニューを非表示にする
        
        const savedName = localStorage.getItem(id) || '';

        // 入力がある場合のみ編集・削除プロンプトを出す
        if (savedName) {
            const nameInput = prompt(`【${savedName}】の編集\n新しい授業名を入力してください。\n（空欄にしてOKを押すと消去されます）`, savedName);
            
            if (nameInput !== null) {
                const trimmedInput = nameInput.trim();
                if (trimmedInput === "") {
                    // 削除時は授業名も出欠カウントも消す
                    localStorage.removeItem(id);
                    localStorage.removeItem(`att-absent-${savedName}`);
                } else {
                    // 変更時は新しい授業名で保存
                    localStorage.setItem(id, trimmedInput);
                }
                refreshAllButtons(); // 全体の色と表示を更新
            }
        }
    }

    // ★すべてのボタンの「表示文字」と「背景色」を最新状態にする関数
    function refreshAllButtons() {
        Array.from(document.getElementsByClassName("savecontrol")).forEach((btn) => {   
            const subjectName = localStorage.getItem(btn.id);

            if (subjectName) {
                // 欠席数を取得（なければ0）
                const absentCount = localStorage.getItem(`att-absent-${subjectName}`) || 0;
                
                // ボタンの文字をセット
                btn.value = `${subjectName}\n(欠席:${absentCount}回)`;
                
                // ★同じ授業名なら同じ背景色を自動セット
                btn.style.backgroundColor = getSubjectColor(subjectName);
                btn.style.color = '#000'; // 授業名は黒文字
                btn.style.fontWeight = 'bold';

                if (parseInt(absentCount, 10) > 0) {
                    btn.style.borderColor = '#f8b500';
                    btn.style.boxShadow = '0 0 4px rgba(220, 53, 69, 0.5)';
                } else {
                    btn.style.borderColor = '#bbb';
                    btn.style.boxShadow = 'none';
                }
            } else {
                // 授業名が未登録なら初期状態（白）に戻す
                btn.value = "";
                btn.style.backgroundColor = '#ffffff';
                btn.style.borderColor = '#bbb';
                btn.style.boxShadow = 'none';
            }
        });
    }

    window.addEventListener("load", refreshAllButtons);
    
    // 別タブ（出欠ページ）から戻ってきたときに画面を自動更新
    window.addEventListener("focus", refreshAllButtons);
    </script>
