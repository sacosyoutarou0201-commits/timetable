<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>時間割</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 8px;
            font-family: sans-serif;
            background: #fafafa;
        }

        h1, h3 {
            text-align: center;
            margin: 8px 0;
        }

        h1 {
            font-size: 22px;
        }

        h3 {
            font-size: 12px;
            font-weight: normal;
            color: #555;
            line-height: 1.5;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 2px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f5f5f5;
            font-size: 12px;
            word-break: keep-all;
        }

        .period-cell {
            width: 52px;
        }

        .cell-box {
            position: relative;
            width: 100%;
            min-height: 76px;
        }

        .subject-btn {
            width: 100%;
            height: 76px;
            font-size: 10px;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.15;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: #ffffff;
            transition: background-color 0.2s, transform 0.05s;
            -webkit-appearance: none;
            appearance: none;
            padding: 18px 4px 4px 4px;
            touch-action: manipulation;
            color: #000;
        }

        .subject-btn:active,
        .edit-btn:active {
            transform: scale(0.98);
        }

        .edit-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border: 1px solid #aaa;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            z-index: 2;
            touch-action: manipulation;
        }

        .edit-btn:hover {
            background: #f0f0f0;
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            line-height: 1.5;
        }

        @media screen and (min-width: 768px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 26px;
            }

            h3 {
                font-size: 14px;
            }

            th {
                font-size: 15px;
            }

            .period-cell {
                width: 70px;
            }

            .cell-box {
                min-height: 84px;
            }

            .subject-btn {
                height: 84px;
                font-size: 13px;
                padding: 20px 6px 6px 6px;
            }

            .edit-btn {
                width: 24px;
                height: 24px;
                font-size: 13px;
            }

            .hint {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <h1>時間割</h1>
    <h3>
        タップ：出欠確認 / 新規登録<br>
        右上の ✎：授業名の編集・削除
    </h3>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th class="period-cell">時間<br>/曜日</th>
                    <th>月曜</th>
                    <th>火曜</th>
                    <th>水曜</th>
                    <th>木曜</th>
                    <th>金曜</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="period-cell">1限<br>2限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-1" type="button">✎</button><input type="button" id="mon-1" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-1" type="button">✎</button><input type="button" id="tue-1" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-1" type="button">✎</button><input type="button" id="wed-1" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-1" type="button">✎</button><input type="button" id="thu-1" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-1" type="button">✎</button><input type="button" id="fri-1" class="subject-btn"></div></td>
                </tr>
                <tr>
                    <th class="period-cell">3限<br>4限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-2" type="button">✎</button><input type="button" id="mon-2" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-2" type="button">✎</button><input type="button" id="tue-2" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-2" type="button">✎</button><input type="button" id="wed-2" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-2" type="button">✎</button><input type="button" id="thu-2" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-2" type="button">✎</button><input type="button" id="fri-2" class="subject-btn"></div></td>
                </tr>
                <tr>
                    <th class="period-cell">5限<br>6限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-3" type="button">✎</button><input type="button" id="mon-3" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-3" type="button">✎</button><input type="button" id="tue-3" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-3" type="button">✎</button><input type="button" id="wed-3" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-3" type="button">✎</button><input type="button" id="thu-3" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-3" type="button">✎</button><input type="button" id="fri-3" class="subject-btn"></div></td>
                </tr>
                <tr>
                    <th class="period-cell">7限<br>8限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-4" type="button">✎</button><input type="button" id="mon-4" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-4" type="button">✎</button><input type="button" id="tue-4" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-4" type="button">✎</button><input type="button" id="wed-4" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-4" type="button">✎</button><input type="button" id="thu-4" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-4" type="button">✎</button><input type="button" id="fri-4" class="subject-btn"></div></td>
                </tr>
                <tr>
                    <th class="period-cell">9限<br>10限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-5" type="button">✎</button><input type="button" id="mon-5" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-5" type="button">✎</button><input type="button" id="tue-5" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-5" type="button">✎</button><input type="button" id="wed-5" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-5" type="button">✎</button><input type="button" id="thu-5" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-5" type="button">✎</button><input type="button" id="fri-5" class="subject-btn"></div></td>
                </tr>
                <tr>
                    <th class="period-cell">11限<br>12限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-6" type="button">✎</button><input type="button" id="mon-6" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-6" type="button">✎</button><input type="button" id="tue-6" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-6" type="button">✎</button><input type="button" id="wed-6" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-6" type="button">✎</button><input type="button" id="thu-6" class="subject-btn"></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-6" type="button">✎</button><input type="button" id="fri-6" class="subject-btn"></div></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="hint">
        ※ コマ本体を押すと出欠確認、新規登録もできます<br>
        ※ ✎ ボタンで授業名の編集・削除ができます
    </div>

    <script>
        const colorPalette = [
            '#e1f5fe', '#f3e5f5', '#efebe9', '#e8f5e9', '#fff3e0',
            '#fce4ec', '#f0f4c3', '#e0f2f1', '#e8eaf6', '#ede7f6',
            '#afeeee', '#f8f8ff'
        ];

        function getSubjectColor(subjectName) {
            if (!subjectName) return '#ffffff';
            let hash = 0;
            for (let i = 0; i < subjectName.length; i++) {
                hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % colorPalette.length;
            return colorPalette[index];
        }

        function clicked(id) {
            const savedName = localStorage.getItem(id) || '';

            if (!savedName) {
                const nameInput = prompt('授業名を入力してください：');
                if (nameInput !== null) {
                    const trimmed = nameInput.trim();
                    if (trimmed) {
                        localStorage.setItem(id, trimmed);
                        refreshAllButtons();
                    }
                }
            } else {
                const pageUrl = `attendance.html?subject=${encodeURIComponent(savedName)}`;
                window.open(pageUrl, '_blank');
            }
        }

        function editCell(id) {
            const savedName = localStorage.getItem(id) || '';

            if (!savedName) {
                const nameInput = prompt('このコマは未登録です。\n新しい授業名を入力してください：');
                if (nameInput !== null) {
                    const trimmed = nameInput.trim();
                    if (trimmed) {
                        localStorage.setItem(id, trimmed);
                        refreshAllButtons();
                    }
                }
                return;
            }

            const nameInput = prompt(
                `【${savedName}】の編集\n新しい授業名を入力してください。\n（空欄にしてOKを押すと消去されます）`,
                savedName
            );

            if (nameInput !== null) {
                const trimmedInput = nameInput.trim();

                if (trimmedInput === "") {
                    localStorage.removeItem(id);
                    localStorage.removeItem(`att-absent-${savedName}`);
                } else {
                    const oldAbsent = localStorage.getItem(`att-absent-${savedName}`);
                    localStorage.setItem(id, trimmedInput);

                    if (oldAbsent !== null && trimmedInput !== savedName) {
                        localStorage.setItem(`att-absent-${trimmedInput}`, oldAbsent);
                        localStorage.removeItem(`att-absent-${savedName}`);
                    }
                }

                refreshAllButtons();
            }
        }

        function refreshAllButtons() {
            const isMobile = window.innerWidth <= 600;

            document.querySelectorAll(".subject-btn").forEach((btn) => {
                const subjectName = localStorage.getItem(btn.id);

                if (subjectName) {
                    const absentCount = localStorage.getItem(`att-absent-${subjectName}`) || 0;

                    btn.value = isMobile
                        ? `${subjectName}\n欠:${absentCount}`
                        : `${subjectName}\n(欠席:${absentCount}回)`;

                    btn.style.backgroundColor = getSubjectColor(subjectName);
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'bold';

                    if (parseInt(absentCount, 10) > 0) {
                        btn.style.borderColor = '#f8b500';
                        btn.style.boxShadow = '0 0 4px rgba(220, 53, 69, 0.5)';
                    } else {
                        btn.style.borderColor = '#bbb';
                        btn.style.boxShadow = 'none';
                    }
                } else {
                    btn.value = '';
                    btn.style.backgroundColor = '#ffffff';
                    btn.style.borderColor = '#bbb';
                    btn.style.boxShadow = 'none';
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'normal';
                }
            });
        }

        function initializeButtons() {
            document.querySelectorAll('.subject-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    clicked(btn.id);
                });
            });

            document.querySelectorAll('.edit-btn').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editCell(btn.dataset.id);
                });
            });

            refreshAllButtons();
        }

        window.addEventListener("load", initializeButtons);
        window.addEventListener("focus", refreshAllButtons);
        window.addEventListener("resize", refreshAllButtons);
    </script>
</body>
</html>
