<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>時間割</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 10px;
            font-family: sans-serif;
            background: #fafafa;
        }

        h1, h3 {
            text-align: center;
            margin: 8px 0;
        }

        h1 {
            font-size: 24px;
        }

        h3 {
            font-size: 14px;
            font-weight: normal;
            color: #555;
            line-height: 1.5;
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        table {
            margin: 0 auto;
            font-size: 16px;
            border-collapse: collapse;
            min-width: 700px;
            background: #fff;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 4px;
            text-align: center;
        }

        th {
            background: #f5f5f5;
        }

        input[type="button"] {
            width: 110px;
            height: 68px;
            font-size: 13px;
            cursor: pointer;
            white-space: pre-wrap;
            line-height: 1.25;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: #ffffff;
            transition: background-color 0.2s, transform 0.05s;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="button"]:active {
            transform: scale(0.98);
        }

        .hint {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 20px;
            }

            h3 {
                font-size: 12px;
            }

            table {
                font-size: 14px;
                min-width: 620px;
            }

            input[type="button"] {
                width: 95px;
                height: 60px;
                font-size: 12px;
            }

            th, td {
                padding: 2px;
            }
        }
    </style>
</head>
<body>
    <h1>時間割</h1>
    <h3>
        短くタップ：出欠確認 / 新規登録<br>
        長押し：授業名の編集・削除
    </h3>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>時間/曜日</th>
                    <th>月曜</th>
                    <th>火曜</th>
                    <th>水曜</th>
                    <th>木曜</th>
                    <th>金曜</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>1限<br>2限</th>
                    <td><input type="button" id="mon-1" class="savecontrol"></td>
                    <td><input type="button" id="tue-1" class="savecontrol"></td>
                    <td><input type="button" id="wed-1" class="savecontrol"></td>
                    <td><input type="button" id="thu-1" class="savecontrol"></td>
                    <td><input type="button" id="fri-1" class="savecontrol"></td>
                </tr>
                <tr>
                    <th>3限<br>4限</th>
                    <td><input type="button" id="mon-2" class="savecontrol"></td>
                    <td><input type="button" id="tue-2" class="savecontrol"></td>
                    <td><input type="button" id="wed-2" class="savecontrol"></td>
                    <td><input type="button" id="thu-2" class="savecontrol"></td>
                    <td><input type="button" id="fri-2" class="savecontrol"></td>
                </tr>
                <tr>
                    <th>5限<br>6限</th>
                    <td><input type="button" id="mon-3" class="savecontrol"></td>
                    <td><input type="button" id="tue-3" class="savecontrol"></td>
                    <td><input type="button" id="wed-3" class="savecontrol"></td>
                    <td><input type="button" id="thu-3" class="savecontrol"></td>
                    <td><input type="button" id="fri-3" class="savecontrol"></td>
                </tr>
                <tr>
                    <th>7限<br>8限</th>
                    <td><input type="button" id="mon-4" class="savecontrol"></td>
                    <td><input type="button" id="tue-4" class="savecontrol"></td>
                    <td><input type="button" id="wed-4" class="savecontrol"></td>
                    <td><input type="button" id="thu-4" class="savecontrol"></td>
                    <td><input type="button" id="fri-4" class="savecontrol"></td>
                </tr>
                <tr>
                    <th>9限<br>10限</th>
                    <td><input type="button" id="mon-5" class="savecontrol"></td>
                    <td><input type="button" id="tue-5" class="savecontrol"></td>
                    <td><input type="button" id="wed-5" class="savecontrol"></td>
                    <td><input type="button" id="thu-5" class="savecontrol"></td>
                    <td><input type="button" id="fri-5" class="savecontrol"></td>
                </tr>
                <tr>
                    <th>11限<br>12限</th>
                    <td><input type="button" id="mon-6" class="savecontrol"></td>
                    <td><input type="button" id="tue-6" class="savecontrol"></td>
                    <td><input type="button" id="wed-6" class="savecontrol"></td>
                    <td><input type="button" id="thu-6" class="savecontrol"></td>
                    <td><input type="button" id="fri-6" class="savecontrol"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="hint">※ PCでは右クリックでも編集できます</div>

    <script>
        // ===== 色設定 =====
        const colorPalette = [
            '#e1f5fe', '#f3e5f5', '#efebe9', '#e8f5e9', '#fff3e0',
            '#fce4ec', '#f0f4c3', '#e0f2f1', '#e8eaf6', '#ede7f6',
            '#afeeee', '#f8f8ff'
        ];

        function getSubjectColor(subjectName) {
            if (!subjectName) return '#ffffff';
            let hash = 0;
            for (let i = 0; i < subjectName.length; i++) {
                hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % colorPalette.length;
            return colorPalette[index];
        }

        // ===== 通常タップ / 左クリック =====
        function clicked(id) {
            const savedName = localStorage.getItem(id) || '';

            if (!savedName) {
                const nameInput = prompt('授業名を入力してください：');
                if (nameInput !== null) {
                    const trimmed = nameInput.trim();
                    if (trimmed) {
                        localStorage.setItem(id, trimmed);
                        refreshAllButtons();
                    }
                }
            } else {
                const pageUrl = `attendance.html?subject=${encodeURIComponent(savedName)}`;
                window.open(pageUrl, '_blank');
            }
        }

        // ===== 編集・削除 =====
        function editCell(id) {
            const savedName = localStorage.getItem(id) || '';

            if (!savedName) {
                const nameInput = prompt('このコマは未登録です。\n新しい授業名を入力してください：');
                if (nameInput !== null) {
                    const trimmed = nameInput.trim();
                    if (trimmed) {
                        localStorage.setItem(id, trimmed);
                        refreshAllButtons();
                    }
                }
                return;
            }

            const nameInput = prompt(
                `【${savedName}】の編集\n新しい授業名を入力してください。\n（空欄にしてOKを押すと消去されます）`,
                savedName
            );

            if (nameInput !== null) {
                const trimmedInput = nameInput.trim();

                if (trimmedInput === "") {
                    localStorage.removeItem(id);
                    localStorage.removeItem(`att-absent-${savedName}`);
                } else {
                    // 名前変更時、欠席データを引き継ぐ
                    const oldAbsent = localStorage.getItem(`att-absent-${savedName}`);
                    localStorage.setItem(id, trimmedInput);

                    if (oldAbsent !== null && trimmedInput !== savedName) {
                        localStorage.setItem(`att-absent-${trimmedInput}`, oldAbsent);
                        localStorage.removeItem(`att-absent-${savedName}`);
                    }
                }

                refreshAllButtons();
            }
        }

        // ===== 表示更新 =====
        function refreshAllButtons() {
            Array.from(document.getElementsByClassName("savecontrol")).forEach((btn) => {
                const subjectName = localStorage.getItem(btn.id);

                if (subjectName) {
                    const absentCount = localStorage.getItem(`att-absent-${subjectName}`) || 0;

                    btn.value = `${subjectName}\n(欠席:${absentCount}回)`;
                    btn.style.backgroundColor = getSubjectColor(subjectName);
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'bold';

                    if (parseInt(absentCount, 10) > 0) {
                        btn.style.borderColor = '#f8b500';
                        btn.style.boxShadow = '0 0 4px rgba(220, 53, 69, 0.5)';
                    } else {
                        btn.style.borderColor = '#bbb';
                        btn.style.boxShadow = 'none';
                    }
                } else {
                    btn.value = "";
                    btn.style.backgroundColor = '#ffffff';
                    btn.style.borderColor = '#bbb';
                    btn.style.boxShadow = 'none';
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'normal';
                }
            });
        }

        // ===== 長押し対応 =====
        function setupLongPress(button, id) {
            let pressTimer = null;
            let longPressTriggered = false;
            const LONG_PRESS_TIME = 600; // 0.6秒

            function startPress() {
                longPressTriggered = false;
                clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    editCell(id);
                }, LONG_PRESS_TIME);
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            // スマホ用
            button.addEventListener('touchstart', function(e) {
                startPress();
            }, { passive: true });

            button.addEventListener('touchend', function(e) {
                clearTimeout(pressTimer);

                // 長押し後は通常クリック動作を止める
                if (longPressTriggered) {
                    e.preventDefault();
                    longPressTriggered = false;
                } else {
                    clicked(id);
                }
            });

            button.addEventListener('touchmove', function() {
                cancelPress();
            });

            button.addEventListener('touchcancel', function() {
                cancelPress();
            });

            // PC左クリック
            button.addEventListener('click', function(e) {
                // touchendで処理済みの二重実行を避ける
                if ('ontouchstart' in window) return;
                clicked(id);
            });

            // PC右クリック
            button.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                cancelPress();
                editCell(id);
            });

            // マウス長押しでも編集できるようにする（おまけ）
            button.addEventListener('mousedown', function(e) {
                if (e.button === 0) startPress();
            });

            button.addEventListener('mouseup', function() {
                cancelPress();
            });

            button.addEventListener('mouseleave', function() {
                cancelPress();
            });
        }

        // ===== 初期化 =====
        function initializeButtons() {
            const buttons = document.querySelectorAll('.savecontrol');
            buttons.forEach((btn) => {
                setupLongPress(btn, btn.id);
            });
            refreshAllButtons();
        }

        window.addEventListener("load", initializeButtons);
        window.addEventListener("focus", refreshAllButtons);
    </script>
</body>
</html>
